[project]
name = "refinedgaw-html-extractor"
version = "0.1.0"
description = "Reproduce the RefinedGAW HTML text extraction pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "trafilatura==2.0.0",
]

[project.scripts]
refinedgaw-extract-html = "refinedgaw_html.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refinedgaw_html"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
