[project]
name = "refinedgaw-rehydrate"
version = "0.1.3"
description = "Download current public source documents indexed by RefinedGAW"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28,<1",
    "pyarrow>=18,<24",
    "tldextract>=5.3,<6",
]

[project.urls]
Dataset = "https://hf.co/datasets/ellamind/RefinedGAW"
Repository = "https://github.com/maxidl/refinedgaw-rehydrate"

[project.scripts]
refinedgaw = "refinedgaw_rehydrate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refinedgaw_rehydrate"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
